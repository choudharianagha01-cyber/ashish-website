{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="mb-3">Write / Publish Today's Blog</h2>

        {% if message %}
            <div class="alert alert-info">{{ message }}</div>
        {% endif %}

        {# Mode handling: show login form or write form depending on `mode` variable #}
        {% if mode == 'write' %}
        <form method="post">
            <input type="hidden" name="action" value="publish">
            <input type="hidden" name="username" value="{{ username }}">
            <input type="hidden" name="password" value="{{ password }}">

            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>
            <div class="mb-3">
                <label for="blog_content" class="form-label">Blog Content</label>
                <textarea class="form-control" id="blog_content" name="blog_content" rows="12" required></textarea>
            </div>
            <button type="submit" class="btn btn-success">Publish</button>
            <a href="{{ url_for('blog') }}" class="btn btn-secondary ms-2">View Published</a>
        </form>
        {% else %}
        <form method="post">
            <input type="hidden" name="action" value="login">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Continue</button>
        </form>
        {% endif %}
    </div>
</div>

{% endblock %}
