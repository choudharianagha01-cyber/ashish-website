{% extends "base.html" %}
{% block content %}

<section class="home-hero">
    <div class="row align-items-center" style="position: relative; min-height: 350px;">
        <div class="col-md-7 d-flex flex-column justify-content-center" style="z-index:1;">
            <div class="hero-content">
                <h1 class="firm-title">{{ firm_name }}</h1>
                <h4 class="lawyer-name mt-3" style="color:var(--primary);">
                    {{ lawyer_name }}
                </h4>
                <p class="hero-tagline mt-3">
                    {{ hero_tagline }}
                </p>
                <div class="hero-actions mt-4">
                    <a href="{{ url_for('contact') }}" class="btn btn-outline-dark me-3">
                        {{ hero_button_1 }}
                    </a>
                    <a href="{{ url_for('latest_blog') }}" class="btn btn-outline-dark ms-3">
                        Read Today's Blog
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-5 d-none d-md-block" style="position:relative;display:flex;align-items:center;justify-content:center;">
            <img src="{{ url_for('static', filename=homepage_bg) }}" alt="Homepage Background" class="img-fluid" style="max-height:480px;width:100%;object-fit:cover;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,0.08);">
        </div>
    </div>
</section>

{% endblock %}
