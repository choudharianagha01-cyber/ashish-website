{% extends 'base.html' %}

{% block content %}
<div class="text-center mb-5">
    <h2 class="section-title" style="color:var(--primary);">Practice Areas</h2>
    <p class="lead">Explore the areas of law we specialize in</p>
</div>

<div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4">
    {% for area in practice_areas %}
    <div class="col">
        <div class="card text-center practice-card h-100" style="background:var(--background);color:var(--primary);">
            <div class="card-body d-flex flex-column align-items-center justify-content-center">
                <i class="fas {{ area.icon }} fa-2x mb-3 practice-icon" style="color:var(--accent);"></i>
                <h5 class="card-title" style="color:var(--primary);">{{ area.name }}</h5>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
