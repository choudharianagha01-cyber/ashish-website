{% extends "base.html" %}
{% block content %}

<div class="py-4">
    {% if not post %}
        <div class="alert alert-warning">Post not found.</div>
        <a href="{{ url_for('blog') }}" class="btn btn-secondary">Back to Blog</a>
    {% else %}
        <h2 class="mb-2">{{ post.title }}</h2>
        <div class="text-muted small mb-3">By {{ post.author }} &middot; {{ post.timestamp }}</div>
        <div class="blog-content">{{ post.content | replace('\n', '<br>') | safe }}</div>
        <a href="{{ url_for('blog') }}" class="btn btn-secondary mt-3">Back to Blog</a>
    {% endif %}
</div>

{% endblock %}
