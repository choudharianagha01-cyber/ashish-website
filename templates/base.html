<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ firm_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">


    <link rel="stylesheet" href="{{ url_for('dynamic_style') }}">
</head>


<body{% if request.endpoint == 'home' %} class="home-bg"{% endif %}>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg px-4 py-3">
    <div class="navbar-brand d-flex flex-column align-items-center">
        <img src="{{ url_for('static', filename=image_logo) }}" width="100" height="100" style="margin-bottom: 0px;">
        <span style="margin-top: -8px;">{{ firm_name }}</span>
    </div>
    <div class="collapse navbar-collapse justify-content-end">
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('practice') }}">Practice Areas</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('blog') }}">Blogs</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('contact') }}">Contact</a></li>
        </ul>
    </div>
</nav>

<!-- Main Content -->
<div class="container py-5">
    {% block content %}{% endblock %}
</div>

</body>
</html>
